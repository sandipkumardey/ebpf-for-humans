name: Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          npm install markdownlint-cli cspell markdown-link-check

      - name: Run markdownlint
        run: npx markdownlint chapters/*.md

      - name: Run cspell
        run: npx cspell chapters/*.md

      - name: Run link check
        run: npx markdown-link-check chapters/05_Further_Reading.md 